<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .f-mono {
      font-family: 'Fira Code', 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'Courier New', monospace;
    }
    .cursor {
      animation: blink 0.8s infinite;
      fill: #00f2fe;
    }
    .prompt { fill: #ff3366; font-weight: bold; font-size: 15px; }
    .cmd { fill: #f0f6fc; font-weight: 600; font-size: 15px; }
    .output { fill: #8b949e; font-size: 14px; }
    .cyan { fill: #00f2fe; }
    .green { fill: #00e676; }
    .yellow { fill: #f1e05a; }
    .orange { fill: #ff9100; }
    .purple { fill: #b388ff; }

    /* Sequential Line-by-Line Reveals */
    .step-1 { opacity: 0; animation: fadeIn 0.3s ease 0.3s forwards; }
    .step-2 { opacity: 0; animation: fadeIn 0.4s ease 1.1s forwards; }
    .step-3 { opacity: 0; animation: fadeIn 0.3s ease 2.0s forwards; }
    .step-4 { opacity: 0; animation: fadeIn 0.4s ease 2.8s forwards; }
    .step-5 { opacity: 0; animation: fadeIn 0.3s ease 3.8s forwards; }
    .step-6 { opacity: 0; animation: fadeIn 0.4s ease 4.6s forwards; }
    .step-7 { opacity: 0; animation: fadeIn 0.3s ease 5.5s forwards; }
    .step-8 { opacity: 0; animation: fadeIn 0.2s ease 6.2s forwards; }
  </style>

  <!-- Window Container -->
  <rect x="2" y="2" width="846" height="376" rx="12" fill="url(#bgGrad)" stroke="#1e2638" stroke-width="2" />
  
  <!-- Window Header Bar -->
  <line x1="2" y1="44" x2="848" y2="44" stroke="#1e2638" stroke-width="1.5" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="23" r="6" fill="#ff5f56" />
  <circle cx="44" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="23" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="425" y="28" fill="#6e7681" font-size="13" text-anchor="middle" class="f-mono">
    sachin@telemetry-os: ~/workspace (zsh)
  </text>
  
  <!-- LINE 1: $ whoami (y=88) -->
  <text x="35" y="88" class="f-mono step-1">
    <tspan class="prompt">$ </tspan>
    <tspan class="cmd">whoami</tspan>
  </text>

  <!-- OUTPUT 1: (y=114) -->
  <text x="52" y="114" class="f-mono output step-2">
    <tspan class="cyan" font-weight="600">sachin_kumar_upadhyay</tspan> · systems &amp; full-stack engineer · product builder
  </text>

  <!-- LINE 2: $ cat core-stack.json (y=154) -->
  <text x="35" y="154" class="f-mono step-3">
    <tspan class="prompt">$ </tspan>
    <tspan class="cmd">cat core-stack.json</tspan>
  </text>

  <!-- OUTPUT 2: (y=180) -->
  <text x="52" y="180" class="f-mono output step-4">
    <tspan class="cyan">TypeScript</tspan> ➔ 
    <tspan class="cyan">React/Next.js</tspan> ➔ 
    <tspan class="green">Node.js</tspan> ➔ 
    <tspan class="purple">PostgreSQL/Redis</tspan> ➔ 
    <tspan class="orange">Docker/Linux</tspan>
  </text>

  <!-- LINE 3: $ git log -1 (y=220) -->
  <text x="35" y="220" class="f-mono step-5">
    <tspan class="prompt">$ </tspan>
    <tspan class="cmd">git log -1 --pretty=oneline</tspan>
  </text>

  <!-- OUTPUT 3: (y=246) -->
  <text x="52" y="246" class="f-mono output step-6">
    <tspan class="yellow">b42f9a1</tspan> ➔ <tspan class="green">feat:</tspan> ship scalable microservices with sub-100ms latency
  </text>

  <!-- LINE 4: $ ./focus (y=286) -->
  <text x="35" y="286" class="f-mono step-7">
    <tspan class="prompt">$ </tspan>
    <tspan class="cmd">./focus --continuous-mode</tspan>
  </text>
  
  <!-- Active Blinking Cursor on Line 4 (y=273) -->
  <rect x="268" y="272" width="9" height="17" rx="2" class="cursor step-8" />

  <!-- BOTTOM STATUS BAR -->
  <line x1="2" y1="345" x2="848" y2="345" stroke="#161b26" stroke-width="1.5" />
  
  <circle cx="34" cy="360" r="3.5" fill="#00e676" />
  <text x="44" y="364" fill="#00e676" font-size="12" font-weight="600" class="f-mono">main</text>
  <text x="105" y="364" fill="#484f58" font-size="12" class="f-mono">↑1 · 0</text>
  <text x="175" y="364" fill="#484f58" font-size="12" class="f-mono">telemetry: <tspan class="cyan">active</tspan></text>
  <text x="815" y="364" fill="#484f58" font-size="12" text-anchor="end" class="f-mono">utf-8 · zsh · v2026.11</text>
</svg>
